plugins {
    id 'net.fabricmc.fabric-loom' version '1.18.2'
    id 'maven-publish'
    id "net.linguica.maven-settings" version "0.5"
}

version = project.mod_version + "+" + project.minecraft_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}


repositories {
    // Serves Polymer modules
    maven {
        url 'https://maven.nucleoid.xyz'
    }
    maven {
        url "https://repo.biryeong.kim/releases/"
    }

    maven {
        url("https://maven.supersanta.me/snapshots")
    }

    maven {
        url("https://jitpack.io")
    }
    maven {
        url 'https://kneelawk.com/maven/'
        name 'Kneelawk Maven'
    }
    maven {
        // For LibNetworkStack, if using 'syncing' module
        url 'https://maven.alexiil.uk/'
        name 'AlexIIL Maven'
    }

//     Uncomment if using Rosemary or some other Modrinth dependency
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }

        filter {
            includeGroup "maven.modrinth"
        }
    }
    maven { url "https://maven.tomalbrc.de" }
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.3'
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Polymer
    implementation("eu.pb4:polymer-core:${project.polymer_version}")
    implementation("eu.pb4:polymer-virtual-entity:${project.polymer_version}")
    implementation("eu.pb4:polymer-resource-pack:${project.polymer_version}")
    implementation("eu.pb4:polymer-resource-pack-extras:${project.polymer_version}")
    implementation("eu.pb4:polymer-autohost:${project.polymer_version}")
    implementation("eu.pb4:polymer-blocks:${project.polymer_version}")

    implementation include("net.kyori:adventure-platform-fabric:${project.adventure_platform_version}")
    implementation "net.kyori:adventure-text-minimessage:${project.adventure_api_version}"
    implementation "net.kyori:adventure-api:${project.adventure_api_version}"

    // Server-Translations
//    implementation include("xyz.nucleoid:server-translations-api:${project.server_translations_version}")
//    implementation include("xyz.nucleoid:stimuli:${project.stimuli_version}")
//    implementation("de.tomalbrc:DialogUtils:${project.dialogutils_version}")

//    implementation include("xyz.nucleoid:fantasy:${project.fantasy_version}")
//    implementation include("xyz.nucleoid:map-templates:${project.map_templates}")
//    implementation include("eu.pb4:sidebar-api:${project.sidebar_api_version}")
//    implementation include("de.tomalbrc:avatar-renderer:${project.avatar_renderer_version}")
    implementation include("eu.pb4:map-canvas-api:${project.map_canvas_api_version}")

}


test { useJUnitPlatform() }
fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'minigamelib-test'
        enableGameTests = true
        enableClientGameTests = true
        eula = true
    }
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
    from("THIRD_PARTY_NOTICES.md")
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        maven {
            name = "qf-repo"
            url = "https://repo.biryeong.kim/releases/"
        }
    }
}

tasks.withType(JavaCompile).configureEach { options.compilerArgs += ['-Xmaxerrs', '1000'] }
